[[answer]]
check = "logical-lines"
path = "evidence/organisation-design/protocol.md"
question = "139 logical lines, past the trigger of 80. State this file's role in one sentence. If the sentence needs 'and', split the file; if not, it may stay."
file = "098567dea55d"
answer = "Its role in one sentence: it records how the pool was built, from the strings to the forward pass, so that a reader can run the search again; it has no 'and' to split on, and `12. Forward pass` is one more step of that record, so it stays whole under `Protocol`."

[[answer]]
check = "logical-lines"
path = "evidence/organisation-design/sources.md"
question = "107 logical lines, past the trigger of 80. State this file's role in one sentence. If the sentence needs 'and', split the file; if not, it may stay."
file = "20e69e1706fd"
answer = "Its role in one sentence: it lists the pool, each source once with how far it was read; the flow, the two tables and the left-out list, the forward pass's rows among them, are parts of that one list, so it stays whole under `Sources`."

[[answer]]
check = "figures-present"
path = "evidence/organisation-design/review.md"
question = "a long text with no figure, table or diagram: is a relation, set, quantity or process described only in words?"
file = "c8202085b66d"
answer = "No: each finding is one line with its figure and its source, grouped by the question it answers, as in `Strand 2`; the one structure the review leads to, B1's table, is drawn in baseline.md, and a figure here would restate the lists."
[[answer]]
check = "co-change"
path = "evidence/bibliography.md"
question = "changed together with evidence/organisation-design/against.md in 3 commits (100% of the rarer one's), from another folder: should they share a folder, or should one link to the other?"
file = "49c763083d1a"
answer = "They stay apart: the bibliography holds `Every work cited, once` for every review of the repository, and each step of a review cites by key; a source read deeper changes its note there and its use in the step, by the family's layout."
