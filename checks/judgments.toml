# Answers to the judgment questions of checks/out/needs-judgment.md, one [[answer]] per question.

[[answer]]
check = "logical-lines"
path = "evidence/organisation-design/protocol.md"
question = "139 logical lines, past the trigger of 80. State this file's role in one sentence. If the sentence needs 'and', split the file; if not, it may stay."
file = "9992d4162998"
answer = "Its role in one sentence: it records how the pool was built, from the strings to the forward pass, so that a reader can run the search again; it has no 'and' to split on, and `12. Forward pass` is one more step of that record, so it stays whole under `Protocol`."

[[answer]]
